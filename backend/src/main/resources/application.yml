server:
  port: 8081

spring:
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/product_sell?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  ai:
    openai:
      api-key: ${AI_API_KEY}
      # DeepSeek API 基地址（OpenAI 兼容格式）
      base-url: https://api.deepseek.com
      chat:
        enabled: true
        options:
          model: deepseek-chat
          temperature: 0.3      # 低温度，减少编造
          max-tokens: 1500       # 防止长篇编造

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: ${JWT_SECRET:ZGV2LWp3dC1zZWNyZXQtcGxhY2Vob2xkZXI=}
  expiration: 86400000
  remember-me-expiration: 604800000

file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads/}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
